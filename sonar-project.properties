# =========================================================
# SonarQube - análisis del frontend de KAIRÓS
# 1. npm run test:coverage   -> genera coverage/lcov.info
# 2. sonar-scanner           -> lee este archivo y sube el análisis
# =========================================================
# Clave del proyecto que ya existe en SonarQube (distingue mayúsculas)
sonar.projectKey=KAIROS-FRONTEND
sonar.sourceEncoding=UTF-8

# Código de la aplicación (sin las pruebas)
sonar.sources=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

# Pruebas
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

# Cobertura generada por Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Igual que coverage.exclude en vite.config.ts: arranque y archivos solo de tipos
sonar.coverage.exclusions=src/main.tsx,src/types.ts,src/vite-env.d.ts
